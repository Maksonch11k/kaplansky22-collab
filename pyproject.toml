[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaplansky22-collab"
version = "0.2.0"
description = "Certified matching obstructions and reproducible ML baselines for collaborative 22x22 research"
requires-python = ">=3.11"
readme = "README.en.md"
license = "MIT"
dependencies = []

[project.optional-dependencies]
ml = ["numpy>=2.0,<3", "scikit-learn>=1.5,<2", "z3-solver>=4.13,<6"]

[tool.setuptools]
packages = ["k22", "models", "discovery"]
