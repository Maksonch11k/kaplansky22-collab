name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificates:
    name: Certificates (trusted verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Replay submitted data with the base branch verifier
        working-directory: trusted
        run: python -m k22 verify --data ../candidate/data
      - name: Test the trusted verifier
        working-directory: trusted
        run: python -m unittest discover -s tests -p test_verifier.py

  code:
    name: Code and models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install optional ML dependencies
        run: python -m pip install -e ".[ml]"
      - name: Run tests
        run: |
          python -m unittest discover -s tests
          python -m unittest models.test_cem
      - name: Verify with Python optimizations enabled
        run: python -O -m k22 verify --data data
      - name: Smoke test CEM with independent control
        run: python -m models.cem --family trinomial22 --epochs 2 --population 8 --output runs/ci-cem
      - name: Smoke test ExtraTrees and SAT
        run: |
          python -m models.mlsat train --output runs/ci-ml
          python -m models.mlsat generate --family parallel22 --count 2 --output runs/ci-sat
      - name: Rediscover and independently replay the offline chat-cycle demo
        run: |
          python -m discovery demo --output runs/ci-chat
          python -m k22 verify --data runs/ci-chat/verified
